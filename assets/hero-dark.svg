<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="492" viewBox="0 0 1280 492" role="img" aria-label="Paidva: the research agent that shows its work. Animated demo of an answer being verified."><title>Paidva: the research agent that shows its work. Animated demo of an answer being verified.</title><style>@keyframes ty{0%{transform:scaleX(0)}14%,100%{transform:scaleX(1)}}.typed{transform-origin:624px 0;animation:ty 12s steps(40) infinite}@keyframes s0{0%,18%{opacity:0;transform:translateY(4px)}21%,92%{opacity:1;transform:none}100%{opacity:0}}.s0{opacity:0;animation:s0 12s ease-out infinite}@keyframes s1{0%,24%{opacity:0;transform:translateY(4px)}27%,92%{opacity:1;transform:none}100%{opacity:0}}.s1{opacity:0;animation:s1 12s ease-out infinite}@keyframes s2{0%,30%{opacity:0;transform:translateY(4px)}33%,92%{opacity:1;transform:none}100%{opacity:0}}.s2{opacity:0;animation:s2 12s ease-out infinite}@keyframes s3{0%,36%{opacity:0;transform:translateY(4px)}39%,92%{opacity:1;transform:none}100%{opacity:0}}.s3{opacity:0;animation:s3 12s ease-out infinite}@keyframes c0{0%,46%{opacity:0;transform:translateY(4px)}49%,92%{opacity:1;transform:none}100%{opacity:0}}.c0{opacity:0;animation:c0 12s ease-out infinite}@keyframes c1{0%,52%{opacity:0;transform:translateY(4px)}55%,92%{opacity:1;transform:none}100%{opacity:0}}.c1{opacity:0;animation:c1 12s ease-out infinite}@keyframes c2{0%,58%{opacity:0;transform:translateY(4px)}61%,92%{opacity:1;transform:none}100%{opacity:0}}.c2{opacity:0;animation:c2 12s ease-out infinite}@keyframes cf{0%,64%{opacity:0;transform:translateY(4px)}67%,92%{opacity:1;transform:none}100%{opacity:0}}.cf{opacity:0;animation:cf 12s ease-out infinite}@keyframes bar{0%,66%{transform:scaleX(0)}78%,100%{transform:scaleX(1)}}.bar{transform-origin:734px 0;animation:bar 12s ease-out infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1s steps(1) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}.k{opacity:1!important}.typed{transform:none!important}}</style><rect width="1280" height="492" rx="48" fill="#5F4100"/><rect x="56" y="56" width="214" height="34" rx="17" fill="#FFDDB3"/><text x="163" y="78" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#291800" text-anchor="middle" letter-spacing="0">OPEN SOURCE · RUST · V1</text><text x="56" y="176" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="84" font-weight="900" fill="#FFDDB3" text-anchor="start" letter-spacing="-2">Paidva</text><text x="56" y="236" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="500" fill="#FFDDB3" text-anchor="start" letter-spacing="0">The research agent</text><text x="56" y="276" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="500" fill="#FFDDB3" text-anchor="start" letter-spacing="0">that shows its work.</text><text x="56" y="330" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#FFDDB3" text-anchor="start" letter-spacing="0">Every claim tagged. Every number computed.</text><text x="56" y="360" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#FFDDB3" text-anchor="start" letter-spacing="0">Every citation checked word for word.</text><text x="56" y="390" font-family="'Roboto Flex','Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#FFDDB3" text-anchor="start" letter-spacing="0">Confidence you can actually rank by.</text><rect x="600" y="56" width="624" height="380" rx="24" fill="#121410"/><circle cx="628" cy="82" r="6" fill="#FF6B5F"/><circle cx="648" cy="82" r="6" fill="#FFBD2E"/><circle cx="668" cy="82" r="6" fill="#28C93F"/><text x="1200" y="87" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8D9286" text-anchor="end" letter-spacing="0">~/paidva</text><clipPath id="type"><rect class="typed" x="624" y="114" width="600" height="26"/></clipPath><g clip-path="url(#type)"><text x="624" y="132" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">$ paidva ask "Test: 90% sens, 95% spec, 2% prevalence. P(sick | +)?"</text></g><g class="s0 k"><text x="624" y="168" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#FFB95C" text-anchor="start" letter-spacing="0">▸ route</text><text x="750" y="168" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#8D9286" text-anchor="start" letter-spacing="0">maths</text></g><g class="s1 k"><text x="624" y="192" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#FFB95C" text-anchor="start" letter-spacing="0">▸ sandbox</text><text x="750" y="192" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#8D9286" text-anchor="start" letter-spacing="0">python ran in 0.4 s  ✓</text></g><g class="s2 k"><text x="624" y="216" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#FFB95C" text-anchor="start" letter-spacing="0">▸ cross-check</text><text x="750" y="216" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#8D9286" text-anchor="start" letter-spacing="0">simulation agrees ±3σ  ✓</text></g><g class="s3 k"><text x="624" y="240" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#FFB95C" text-anchor="start" letter-spacing="0">▸ quotes</text><text x="750" y="240" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#8D9286" text-anchor="start" letter-spacing="0">1/1 matched verbatim  ✓</text></g><g class="c0 k"><rect x="624" y="261" width="96" height="24" rx="6" fill="#A0CFD0"/><text x="672" y="278" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#121410" text-anchor="middle" letter-spacing="0">observed</text><text x="734" y="278" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">P(sick | +) = 0.2687</text></g><g class="c1 k"><rect x="624" y="295" width="96" height="24" rx="6" fill="#B7F397"/><text x="672" y="312" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#121410" text-anchor="middle" letter-spacing="0">sourced</text><text x="734" y="312" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">“Bayes’ theorem …”  Wikipedia</text></g><g class="c2 k"><rect x="624" y="329" width="96" height="24" rx="6" fill="#D0BCFF"/><text x="672" y="346" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#121410" text-anchor="middle" letter-spacing="0">inferred</text><text x="734" y="346" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">~1 in 4 positives is sick</text></g><g class="cf k"><text x="624" y="386" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#8D9286" text-anchor="start" letter-spacing="0">confidence</text><rect x="734" y="373" width="300" height="14" rx="7" fill="#2C2F28"/><rect class="bar" x="734" y="373" width="258" height="14" rx="7" fill="#FFB95C"/><text x="1050" y="386" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#FFB95C" text-anchor="start" letter-spacing="0">0.86</text></g><text x="624" y="414" font-family="'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#E2E4D9" text-anchor="start" letter-spacing="0">$</text><rect class="cur" x="640" y="401" width="9" height="17" fill="#E2E4D9"/></svg>