<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Results: with Paidva, accuracy rises from 65% to 87% on dev and 33% to 44% on hard; most-confident answers right 80% vs 38%; calibration error falls from 0.64 to 0.24; dead citations from 20% to 0%."><title>Results: with Paidva, accuracy rises from 65% to 87% on dev and 33% to 44% on hard; most-confident answers right 80% vs 38%; calibration error falls from 0.64 to 0.24; dead citations from 20% to 0%.</title><style>@keyframes g00{0%,10%{transform:scaleY(0)}30%,100%{transform:scaleY(1)}}.g00{transform-origin:0 320px;animation:g00 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g01{0%,10%{transform:scaleY(0)}30%,100%{transform:scaleY(1)}}.g01{transform-origin:0 320px;animation:g01 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g10{0%,18%{transform:scaleY(0)}38%,100%{transform:scaleY(1)}}.g10{transform-origin:0 320px;animation:g10 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g11{0%,18%{transform:scaleY(0)}38%,100%{transform:scaleY(1)}}.g11{transform-origin:0 320px;animation:g11 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g20{0%,26%{transform:scaleY(0)}46%,100%{transform:scaleY(1)}}.g20{transform-origin:0 320px;animation:g20 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g21{0%,26%{transform:scaleY(0)}46%,100%{transform:scaleY(1)}}.g21{transform-origin:0 320px;animation:g21 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g30{0%,34%{transform:scaleY(0)}54%,100%{transform:scaleY(1)}}.g30{transform-origin:0 320px;animation:g30 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g31{0%,34%{transform:scaleY(0)}54%,100%{transform:scaleY(1)}}.g31{transform-origin:0 320px;animation:g31 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g40{0%,42%{transform:scaleY(0)}62%,100%{transform:scaleY(1)}}.g40{transform-origin:0 320px;animation:g40 2.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g41{0%,42%{transform:scaleY(0)}62%,100%{transform:scaleY(1)}}.g41{transform-origin:0 320px;animati