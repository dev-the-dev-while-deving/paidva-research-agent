# core rules always load; contextual rules load when a keyword appears in the question.

[[rule]]
id = "core-no-fabrication"
tier = "core"
text = "Never invent a source, quote, number or citation. If you lack one, tag the claim speculation or leave it out."

[[rule]]
id = "core-false-premise"
tier = "core"
text = "If the question rests on a false or unverifiable premise, say so before anything else."

[[rule]]
id = "core-uncertainty"
tier = "core"
text = "State what is uncertain and what evidence would change the answer."

[[rule]]
id = "stats-assumptions"
tier = "contextual"
text = "Before any statistical test, check its assumptions and say which ones fail."
keywords = ["t-test", "anova", "regression", "significant", "p-value", "correlation", "test"]

[[rule]]
id = "stats-multiple-comparisons"
tier = "contextual"
text = "When several hypotheses are tested, correct for multiple comparisons (Holm or Benjamini-Hochberg) and say which."
keywords = ["compare", "groups", "multiple", "each", "several"]

[[rule]]
id = "research-recency"
tier = "contextual"
text = "For research questions, note the year of each source and whether newer work may change the picture."
keywords = ["research", "studies", "evidence", "paper", "literature", "recent"]
