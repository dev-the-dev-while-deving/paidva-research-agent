[package]
name = "agent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A research and statistics agent that shows its work."
repository = "https://github.com/dev-the-dev-while-deving/paidva-research-agent"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form", "gzip"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
toml = "1.2.1"
